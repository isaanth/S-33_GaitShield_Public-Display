<title>GaitShield Weight Browser</title>
<style>
:root {
  --bg: #EBF0EA;
  --surface: #F6F9F5;
  --card: #FFFFFF;
  --border: #D3DCD4;
  --border-strong: #B4C2B7;
  --ink: #14201A;
  --ink-2: #46554C;
  --ink-3: #74837A;
  --accent: #35735A;
  --accent-soft: #E2ECE5;
  --neg: #4F6BA8;
  --pos: #B06E3C;
  --mid: #D8DED8; 
  --shadow: 0 1px 2px rgba(20, 32, 26, .06), 0 4px 16px rgba(20, 32, 26, .04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1411; --surface: #131A16; --card: #18211C;
    --border: #28342D; --border-strong: #3B4A41;
    --ink: #E7EDE8; --ink-2: #B7C3BA; --ink-3: #87958B;
    --accent: #7BAE92; --accent-soft: #1C2A22;
    --neg: #8C9CC9; --pos: #C4906A; --mid: #38443D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"] {
  --bg: #0E1411; --surface: #131A16; --card: #18211C;
  --border: #28342D; --border-strong: #3B4A41;
  --ink: #E7EDE8; --ink-2: #B7C3BA; --ink-3: #87958B;
  --accent: #7BAE92; --accent-soft: #1C2A22;
  --neg: #8C9CC9; --pos: #C4906A; --mid: #38443D;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
}

/* Mono carries the instrument: labels, values, headings. Sans is reserved for
   running prose. Both are local stacks — the artifact CSP blocks font CDNs, and
   a silent webfont fallback would be worse than a chosen stack. */
:root {
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono",
          "Roboto Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cell: 14px;  /* overridden per-view by the size control */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.eyebrow {
  font-size: 10px; text-transform: uppercase; letter-spacing: .14em;
  color: var(--ink-3); font-weight: 600;
}
.num { font-variant-numeric: tabular-nums; }

/* ── Masthead ───────────────────────────────────────────────────────────── */
header {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 18px 24px 0;
}
.masthead {
  display: flex; flex-wrap: wrap; gap: 20px 32px;
  align-items: flex-start; justify-content: space-between;
  max-width: 1600px; margin: 0 auto;
}
h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 2px; }
.sub {
  font-family: var(--sans); font-size: 12.5px; color: var(--ink-2);
  max-width: 62ch; margin: 0;
}
.stats { display: flex; gap: 26px; }
.stat .v { font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }

.tabs { display: flex; gap: 2px; max-width: 1600px; margin: 16px auto 0; }
.tab {
  font-family: var(--mono); font-size: 12px; cursor: pointer;
  padding: 9px 16px; border: 1px solid var(--border); border-bottom: none;
  background: transparent; color: var(--ink-3);
  border-radius: 4px 4px 0 0; margin-bottom: -1px;
}
.tab[aria-selected="true"] {
  background: var(--bg); color: var(--ink); font-weight: 600;
  border-color: var(--border); border-bottom: 1px solid var(--bg);
}

/* ── Frame ──────────────────────────────────────────────────────────────── */
main {
  display: grid; grid-template-columns: 236px minmax(0, 1fr) 264px;
  gap: 20px; max-width: 1600px; margin: 0 auto; padding: 20px 24px 64px;
  align-items: start;
}
@media (max-width: 1180px) { main { grid-template-columns: 220px minmax(0,1fr); } .rail-r { grid-column: 1 / -1; } }
@media (max-width: 820px)  { main { grid-template-columns: 1fr; } }

.panel {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; box-shadow: var(--shadow);
}
.panel-h {
  padding: 11px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.sticky { position: sticky; top: 16px; }

/* ── Layer stack (left rail) ────────────────────────────────────────────── */
.layer {
  display: block; width: 100%; text-align: left; cursor: pointer;
  font-family: var(--mono); background: transparent; color: inherit;
  border: none; border-bottom: 1px solid var(--border);
  border-left: 2px solid transparent; padding: 9px 13px;
}
.layer:last-child { border-bottom: none; }
.layer:hover { background: var(--surface); }
.layer[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.layer .lname { font-size: 12px; font-weight: 600; }
.layer .lmeta { font-size: 10.5px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; }
.layer.inert .lname { color: var(--ink-3); font-weight: 400; }

/* ── Data-flow strip ────────────────────────────────────────────────────── */
.flow {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  max-width: 1600px; margin: 14px auto 0; padding-bottom: 2px;
}
.fnode {
  border: 1px solid var(--border); border-radius: 4px; padding: 4px 9px;
  background: var(--card); line-height: 1.25;
}
.fnode .fs { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fnode .fn { font-size: 9px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.fnode.weighted { border-color: var(--border-strong); }
.farrow { color: var(--ink-3); font-size: 11px; }

/* ── Overview wall (all layers at once) ─────────────────────────────────── */
.wall { display: flex; flex-direction: column; gap: 16px; }
.block { display: flex; flex-direction: column; gap: 6px; }
.block-h {
  display: flex; align-items: baseline; gap: 9px;
  border-bottom: 1px solid var(--border); padding-bottom: 4px;
}
.block-h .bt { font-size: 12px; font-weight: 600; }
.block-h .bm { font-size: 10px; color: var(--ink-3); }
.tenset { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-start; }
.tenbox { display: flex; flex-direction: column; gap: 3px; }
.tenbox .tl { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }

/* ── Personalisation panel ──────────────────────────────────────────────── */
:root { --safe: #4E8C68; --caution: #A87C34; --danger: #B0564D; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --safe: #74B08C; --caution: #CDA35C; --danger: #CF7A72; }
}
:root[data-theme="dark"] { --safe: #74B08C; --caution: #CDA35C; --danger: #CF7A72; }

.pwrap { display: flex; flex-direction: column; gap: 22px; }
.psec { display: flex; flex-direction: column; gap: 9px; }
.psec > h3 { font-size: 12.5px; font-weight: 600; margin: 0; }
.cap { font-family: var(--sans); font-size: 11px; color: var(--ink-3); margin: 0; max-width: 74ch; line-height: 1.5; }
.prov {
  font-size: 10.5px; color: var(--ink-2); padding: 6px 11px;
  border-left: 2px solid var(--accent); background: var(--accent-soft);
  border-radius: 0 4px 4px 0;
}
.kvrow { display: flex; flex-wrap: wrap; gap: 1px; background: var(--border); border-radius: 4px; overflow: hidden; }
.kvb { flex: 1 1 92px; background: var(--card); padding: 7px 10px; }
.kvk { font-size: 9px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.kvv { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
.reset {
  font-family: var(--mono); font-size: 10px; cursor: pointer; color: var(--ink-3);
  background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px;
}
.reset:hover { color: var(--ink); border-color: var(--border-strong); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }
.axline { stroke: var(--border); stroke-width: 1; }
.gridline { stroke: var(--border); stroke-width: 1; opacity: .55; }
.tick { fill: var(--ink-3); font-size: 9.5px; font-family: var(--mono); }
.serieslbl { font-size: 10px; font-family: var(--mono); font-weight: 600; }

.bandrow { display: flex; align-items: center; gap: 10px; }
.bandrow .bl { font-size: 10px; color: var(--ink-3); width: 84px; flex: none; text-align: right; }
.bandbar { flex: 1; display: flex; height: 22px; border-radius: 3px; overflow: hidden; gap: 2px; }
.bandbar div { display: flex; align-items: center; justify-content: center;
  font-size: 9.5px; font-weight: 600; color: var(--card); font-variant-numeric: tabular-nums; }

.sliders { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.sl { display: flex; align-items: center; gap: 7px; }
.sl label { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.sl output { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 34px; }

.consts { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 10.5px; }
.consts dt { color: var(--ink-3); }
.consts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }


/* ── Parameter-mass bar in the layer rail ───────────────────────────────── */
.pbar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 5px; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

/* ── Weight field (center) ──────────────────────────────────────────────── */
.field { padding: 14px; overflow-x: auto; }
.tile-wrap { display: flex; flex-wrap: wrap; gap: 14px; }
.tile { display: flex; flex-direction: column; gap: 4px; }
.tile-cap { font-size: 9.5px; color: var(--ink-3); letter-spacing: .04em; }
.grid { display: grid; gap: 1px; width: max-content; }
.cell {
  width: var(--cell); height: var(--cell);
  border-radius: 1px; cursor: crosshair;
}
.cell:hover, .cell.pin {
  box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--ink);
  position: relative; z-index: 2; border-radius: 0;
}
.axis-row { display: flex; gap: 1px; margin-top: 3px; }
.axis-lbl {
  font-size: 8.5px; color: var(--ink-3); width: var(--cell);
  text-align: center; overflow: visible; white-space: nowrap;
  writing-mode: vertical-rl; height: 44px;
}
.rowlbls { display: grid; gap: 1px; margin-right: 5px; }
.rowlbl {
  font-size: 9px; color: var(--ink-3); height: var(--cell);
  line-height: var(--cell); text-align: right; white-space: nowrap;
}
.matrix-shell { display: flex; align-items: flex-start; }

/* ── Controls ───────────────────────────────────────────────────────────── */
.ctl { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.seg button {
  font-family: var(--mono); font-size: 10.5px; padding: 4px 9px; cursor: pointer;
  background: transparent; color: var(--ink-3); border: none;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--card); font-weight: 600; }
input[type=range] { accent-color: var(--accent); width: 84px; }

/* ── Readout + histogram (right rail) ───────────────────────────────────── */
.readout { padding: 13px 14px; }
.readout .val {
  font-size: 26px; font-weight: 600; letter-spacing: -.03em;
  margin: 2px 0 8px; word-break: break-all;
}
.path { font-size: 11px; color: var(--ink-2); line-height: 1.75; }
.path b { color: var(--ink); font-weight: 600; }
.swatch {
  display: inline-block; width: 11px; height: 11px; border-radius: 2px;
  vertical-align: -1px; margin-right: 5px; border: 1px solid var(--border-strong);
}
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 11px; }
.kv span:first-child { color: var(--ink-3); }
.hist { display: flex; align-items: flex-end; gap: 1px; height: 56px; margin: 8px 0 3px; }
.hbar { flex: 1; min-height: 1px; border-radius: 1px 1px 0 0; }
.hax { display: flex; justify-content: space-between; font-size: 9px; color: var(--ink-3); }

.legend-bar { height: 9px; border-radius: 2px; margin: 7px 0 3px; }
.note { font-family: var(--sans); font-size: 11.5px; color: var(--ink-3); line-height: 1.55; }
footer {
  max-width: 1600px; margin: 0 auto; padding: 0 24px 48px;
  font-family: var(--sans); font-size: 11.5px; color: var(--ink-3);
}
</style>

<header>
  <div class="masthead">
    <div>
      <div class="eyebrow">GaitShield · on-device inference</div>
      <h1 id="mTitle"></h1>
      <p class="sub" id="mDesc"></p>
    </div>
    <div class="stats">
      <div class="stat"><div class="v num" id="sParams"></div><div class="k">parameters</div></div>
      <div class="stat"><div class="v num" id="sLayers"></div><div class="k">weighted layers</div></div>
      <div class="stat"><div class="v num" id="sSize"></div><div class="k">on flash</div></div>
    </div>
  </div>
  <!-- Data-flow strip: the real tensor shape at every stage of the graph. -->
  <div class="flow" id="flow"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>

<main>
  <!-- Layer stack -->
  <div class="panel sticky rail-l">
    <div class="panel-h"><span class="eyebrow">Layer stack</span><span class="eyebrow" id="ioShape"></span></div>
    <div id="layers"></div>
  </div>

  <!-- Weight field -->
  <div class="panel">
    <div class="panel-h" style="flex-wrap:wrap">
      <div>
        <div style="font-size:13px;font-weight:600" id="fTitle"></div>
        <div class="eyebrow" id="fSub" style="margin-top:2px"></div>
      </div>
      <div class="ctl">
        <div class="seg" id="segTensor"></div>
        <div class="seg">
          <button id="cvSqrt" aria-pressed="true">√ scale</button>
          <button id="cvLin" aria-pressed="false">linear</button>
        </div>
        <div class="seg">
          <button id="scT" aria-pressed="true">per-tensor</button>
          <button id="scM" aria-pressed="false">per-model</button>
        </div>
        <label class="eyebrow" style="display:flex;align-items:center;gap:5px">
          size <input type="range" id="cellSize" min="7" max="26" value="14">
        </label>
      </div>
    </div>
    <div class="field" id="field"></div>
  </div>

  <!-- Readout -->
  <div class="panel sticky rail-r">
    <div class="panel-h"><span class="eyebrow">Readout</span><span class="eyebrow" id="pinHint">hover a cell</span></div>
    <div class="readout">
      <div class="eyebrow">weight value</div>
      <div class="val num" id="rVal">—</div>
      <div class="path" id="rPath"><span class="note">Point at any cell to resolve it to an exact
        parameter. Click to pin.</span></div>

      <div style="margin-top:16px" class="eyebrow">Tensor distribution</div>
      <div class="hist" id="hist"></div>
      <div class="hax"><span class="num" id="hMin"></span><span>0</span><span class="num" id="hMax"></span></div>

      <div style="margin-top:14px" class="eyebrow">Scale</div>
      <div class="legend-bar" id="legend"></div>
      <div class="hax"><span class="num" id="lMin"></span><span>0</span><span class="num" id="lMax"></span></div>

      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px">
        <div class="kv"><span>mean</span><b class="num" id="tMean"></b></div>
        <div class="kv"><span>std dev</span><b class="num" id="tStd"></b></div>
        <div class="kv"><span>min</span><b class="num" id="tMin"></b></div>
        <div class="kv"><span>max</span><b class="num" id="tMax"></b></div>
        <div class="kv"><span>rendered</span><b class="num" id="tCount"></b></div>
      </div>
    </div>
  </div>
</main>

<footer id="foot"></footer>

/* ── Color: diverging ramp, two poles through a neutral midpoint ──────────
   Interpolation runs in linear-light sRGB so the midpoint doesn't muddy. */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const toLin = c => { c/=255; return c<=.04045 ? c/12.92 : Math.pow((c+.055)/1.055,2.4); };
const toSrgb = c => 255*(c<=.0031308 ? c*12.92 : 1.055*Math.pow(c,1/2.4)-.055);
let RAMP = {};
function loadRamp(){
  RAMP = { neg: hex2rgb(css('--neg')).map(toLin),
           mid: hex2rgb(css('--mid')).map(toLin),
           pos: hex2rgb(css('--pos')).map(toLin) };
}
function color(t){ // t in [-1, 1]
  const a = RAMP.mid, b = t < 0 ? RAMP.neg : RAMP.pos, k = Math.min(1, Math.abs(t));
  return 'rgb(' + a.map((v,i) => Math.round(toSrgb(v + (b[i]-v)*k))).join(',') + ')';
}

/* ── State ───────────────────────────────────────────────────────────────── */
const S = { view: 'model', m: 0, layer: null, role: null, curve: 'sqrt',
            scale: 'tensor', cell: 14, pinned: null, pinnedEl: null };
const $ = id => document.getElementById(id);
const model = () => DATA.models[S.m];
const layer = () => model().layers.find(l => l.id === S.layer);
const tensor = () => layer().tensors.find(t => t.role === S.role);
const fmt = (v, p = 5) => (v >= 0 ? ' ' : '') + v.toPrecision(p);

/* Colour reference. p98 rather than the outright maximum: weight distributions
   are sharply peaked at zero, so scaling to a lone outlier flattens the whole
   field to grey. Values past the reference clip to the pole. */
const refOf = t => t.stats.absP98 || t.stats.absMax || 1;
function modelRef(){
  return Math.max(...model().layers.flatMap(l => l.tensors.map(refOf)));
}
function scaleRef(){
  return S.scale === 'tensor' ? refOf(tensor()) : modelRef();
}
function norm(v, ref){
  const t = ref ? v / ref : 0;
  return S.curve === 'sqrt' ? Math.sign(t) * Math.sqrt(Math.abs(t)) : t;
}

/* ── Masthead + tabs ─────────────────────────────────────────────────────── */
function tabsHtml(){
  return DATA.models.map((x, i) =>
    `<button class="tab" role="tab" aria-selected="${S.view === 'model' && i === S.m}"
     data-m="${i}">${x.name}</button>`).join('') +
    `<button class="tab" role="tab" aria-selected="${S.view === 'personal'}"
     data-m="p">Personalisation Layer</button>`;
}

function renderHeadPersonal(){
  $('mTitle').textContent = 'Personalisation Layer';
  $('mDesc').textContent =
    'The adaptive half. The networks are frozen at export; per-wearer scoring is not.';
  $('sParams').textContent = SESS.sessionFri;
  $('sLayers').textContent = SESS.n.toLocaleString();
  $('sSize').textContent = '0';
  document.querySelectorAll('.stat .k')[0].textContent = 'recorded session FRI';
  document.querySelectorAll('.stat .k')[1].textContent = 'real samples';
  document.querySelectorAll('.stat .k')[2].textContent = 'network weights changed';
  $('flow').innerHTML = ['observe', 'accumulate (Welford)', 'mature (blend)',
    'personalise bands', 'score'].map((n, i) =>
    `<div class="fnode${i === 3 ? ' weighted' : ''}"><div class="fs">${i + 1}</div>
     <div class="fn">${n}</div></div>`).join('<span class="farrow">→</span>');
  $('tabs').innerHTML = tabsHtml();
  $('ioShape').textContent = 'stages';
  $('layers').innerHTML = `<div style="padding:12px 13px">
    <div class="eyebrow" style="margin-bottom:7px">Shipped guardrails</div>
    <dl class="consts">${Object.entries(K).map(([k, v]) =>
      `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <p class="note" style="margin:10px 0 0">Scraped at build time from
      ${DATA.personalisation.source.join(' and ')}.</p></div>`;
}

function renderHead(){

  $('mTitle').textContent = m.name;

     <div class="fn">${nd.n}</div></div>`).join('<span class="farrow">→</span>');

/* ── Layer stack ─────────────────────────────────────────────────────────── */
function renderLayers(){
  const ls = model().layers;
  const counts = ls.map(l => l.tensors.reduce((a, t) => a + t.count, 0));
  const peak = Math.max(...counts);   // bars are linear: they show where the
                                      // parameter mass actually sits
  const all = `<button class="layer" data-l="__all__" aria-current="${S.layer === '__all__'}">
      <div class="lname">All layers at once</div>
      <div class="lmeta"><span>every parameter on one screen</span>
      <span class="num">${model().totalParams.toLocaleString()}</span></div></button>`;

  $('layers').innerHTML = all + ls.map((l, i) => {
    if (!l.tensors.length)
      return `<div class="layer inert"><div class="lname">${l.label}</div>
              <div class="lmeta"><span>${l.detail}</span></div></div>`;
    return `<button class="layer" data-l="${l.id}" aria-current="${l.id === S.layer}">
      <div class="lname">${l.label}</div>
      <div class="lmeta"><span>${l.tensors.map(t => t.role).join(' · ')}</span>
      <span class="num">${counts[i].toLocaleString()}</span></div>
      <div class="pbar"><i style="width:${(counts[i] / peak * 100).toFixed(1)}%"></i></div></button>`;
  }).join('');
}

/* ── Weight field ────────────────────────────────────────────────────────── */
/* Draw one tensor's complete cell field. Shared by the single-layer view and
   the all-layers wall, so both are guaranteed to render identical geometry. */
function gridFor(l, t, ref){
  const d = t.data;
  const cellOf = (i) => `<div class="cell" data-i="${i}" style="background:${color(norm(d[i], ref))}"></div>`;
  let html = '';

  if (t.role === 'kernel' && l.grid && l.grid.mode === 'filters'){
    // Conv1D kernel [filters, 1, timesteps, channels] — one tile per filter,
    // each tile a timestep × sensor-channel receptive field.
    const { filters, rows, cols } = l.grid;
    const axis = l.colLabels
      ? `<div class="axis-row">${l.colLabels.map(c => `<div class="axis-lbl">${c}</div>`).join('')}</div>` : '';
    html = '<div class="tile-wrap">' + Array.from({ length: filters }, (_, f) => {
      let g = '';
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) g += cellOf(f * rows * cols + r * cols + c);
      return `<div class="tile"><div class="tile-cap">filter ${String(f).padStart(2,'0')}</div>
        <div class="grid" style="grid-template-columns:repeat(${cols},var(--cell))">${g}</div>${axis}</div>`;
    }).join('') + '</div>';

  } else if (t.role === 'kernel' && l.grid && l.grid.mode === 'matrix'){
    // Dense kernel [out, in] — rows are units, columns are incoming features.
    const { rows, cols } = l.grid;
    let g = '';
    for (let i = 0; i < rows * cols; i++) g += cellOf(i);
    const rl = l.rowLabels
      ? `<div class="rowlbls" style="grid-template-rows:repeat(${rows},var(--cell))">${
          l.rowLabels.map(x => `<div class="rowlbl">${x}</div>`).join('')}</div>` : '';
    const axis = l.colLabels
      ? `<div class="axis-row">${l.colLabels.map(c => `<div class="axis-lbl">${c}</div>`).join('')}</div>` : '';
    html = `<div class="matrix-shell">${rl}<div><div class="grid"
      style="grid-template-columns:repeat(${cols},var(--cell))">${g}</div>${axis}</div></div>`;

  } else {
    // 1-D vectors: bias, and the folded BatchNorm shift / scale / offset.
    let g = '';
    for (let i = 0; i < d.length; i++) g += cellOf(i);
    const w = Math.min(d.length, 32);
    html = `<div class="grid" style="grid-template-columns:repeat(${w},var(--cell))">${g}</div>`;
  }
  return html;
}

function renderField(){
  const overview = S.layer === '__all__';
  $('field').style.setProperty('--cell', (overview ? Math.min(S.cell, 10) : S.cell) + 'px');

  if (overview){
    const m = model(), ref = modelRef();
    $('fTitle').textContent = 'Every parameter · ' + m.name;
    $('fSub').textContent =
      `all ${m.totalParams.toLocaleString()} weights of all ` +
      `${m.layers.filter(l => l.tensors.length).length} weighted layers, drawn simultaneously`;
    $('segTensor').innerHTML = '';

    $('field').innerHTML = '<div class="wall">' + m.layers.filter(l => l.tensors.length).map(l => {
      const n = l.tensors.reduce((a, t) => a + t.count, 0);
      const boxes = l.tensors.map(t =>
        `<div class="tenbox" data-l="${l.id}" data-r="${t.role}">
           <div class="tl">${t.role} ${t.shapeNote}</div>${gridFor(l, t, ref)}</div>`).join('');
      return `<div class="block"><div class="block-h"><span class="bt">${l.label}</span>
        <span class="bm">${l.detail} · ${n.toLocaleString()} parameters</span></div>
        <div class="tenset">${boxes}</div></div>`;
    }).join('') + '</div>';

    renderModelStats(ref);
    return;
  }

  const l = layer(), t = tensor(), ref = scaleRef();
  $('fTitle').textContent = l.label;
  $('fSub').textContent = `${t.role} ${t.shapeNote} · ${t.count.toLocaleString()} values · ${l.detail}`;
  $('segTensor').innerHTML = l.tensors.map(x =>
    `<button data-r="${x.role}" aria-pressed="${x.role === S.role}">${x.role}</button>`).join('');
  $('field').innerHTML = gridFor(l, t, ref);
  renderStats(t, ref);
}

/* Overview stats: the distribution of every weight in the model at once. */
function renderModelStats(ref){
  const all = model().layers.flatMap(l => l.tensors.flatMap(t => t.data));
  let mn = Infinity, mx = -Infinity, sum = 0;
  for (const v of all){ if (v < mn) mn = v; if (v > mx) mx = v; sum += v; }
  const mean = sum / all.length;
  let sq = 0; for (const v of all) sq += (v - mean) ** 2;
  renderStats({
    role: 'model', count: all.length, data: all,
    stats: { min: mn, max: mx, mean, std: Math.sqrt(sq / all.length), absMax: Math.max(-mn, mx) },
  }, ref);
}

/* ── Distribution + legend + stats ───────────────────────────────────────── */
function renderStats(t, ref){
  const s = t.stats, B = 28;
  const lo = Math.min(s.min, 0), hi = Math.max(s.max, 0), span = (hi - lo) || 1;
  const bins = new Array(B).fill(0);
  for (const v of t.data) bins[Math.min(B - 1, Math.floor((v - lo) / span * B))]++;
  const peak = Math.max(...bins);
  $('hist').innerHTML = bins.map((n, i) => {
    const c = lo + (i + .5) / B * span;
    return `<div class="hbar" title="${n} weights" style="height:${(n / peak * 100).toFixed(1)}%;
      background:${color(norm(c, ref))}"></div>`;
  }).join('');
  $('hMin').textContent = lo.toFixed(2);
  $('hMax').textContent = hi.toFixed(2);

  const stops = Array.from({ length: 21 }, (_, i) => color(norm((i / 10 - 1) * ref, ref)));
  $('legend').style.background = `linear-gradient(90deg,${stops.join(',')})`;
  // Flag the clip explicitly — the ramp saturates before the true extremes.
  const clipped = ref < s.absMax - 1e-9;
  $('lMin').textContent = (clipped ? '≤ −' : '−') + ref.toFixed(2);
  $('lMax').textContent = (clipped ? '≥ ' : '') + ref.toFixed(2);

  $('tMean').textContent = fmt(s.mean, 3);
  $('tStd').textContent  = fmt(s.std, 3);
  $('tMin').textContent  = fmt(s.min, 3);
  $('tMax').textContent  = fmt(s.max, 3);
  $('tCount').textContent = t.count.toLocaleString() + ' / ' + t.count.toLocaleString();
}

/* ── Readout: resolve a flat index back to a named parameter ─────────────── */
/* In the wall view a cell belongs to whichever tensor block contains it, so
   context is read off the DOM rather than assumed from the selection. */
function ctx(el){
  const box = el.closest('[data-l][data-r]');
  if (!box) return { l: layer(), t: tensor() };
  const l = model().layers.find(x => x.id === box.dataset.l);
  return { l, t: l.tensors.find(x => x.role === box.dataset.r) };
}

function describe(i, l, t){
  const m = model(), g = l.grid;
  const rows = [];
  if (t.role === 'kernel' && g && g.mode === 'filters'){
    const per = g.rows * g.cols, f = Math.floor(i / per), r = Math.floor((i % per) / g.cols), c = i % g.cols;
    rows.push(['filter', f], ['timestep', 't' + r],
              ['channel', l.colLabels ? l.colLabels[c] : c]);
  } else if (t.role === 'kernel' && g && g.mode === 'matrix'){
    const o = Math.floor(i / g.cols), c = i % g.cols;
    rows.push(['unit', l.rowLabels ? l.rowLabels[o] : 'u' + o],
              ['input', l.colLabels ? l.colLabels[c] : 'in' + c]);
  } else {
    // Bias / BatchNorm vectors are per-unit; name the unit where we know it.
    const named = l.rowLabels && l.rowLabels[i];
    rows.push([t.role === 'bias' ? 'unit' : 'channel', named || i]);
  }
  return `<b>${m.name}</b> › <b>${l.label}</b> › <b>${t.role}</b><br>` +
         rows.map(([k, v]) => `${k} <b>${v}</b>`).join(' · ');
}
function showCell(i, el){
  const { l, t } = ctx(el);
  const ref = S.layer === '__all__' ? modelRef()
            : (S.scale === 'tensor' ? refOf(t) : modelRef());
  $('rVal').innerHTML = `<span class="swatch" style="background:${color(norm(t.data[i], ref))}"></span>${fmt(t.data[i])}`;
  $('rPath').innerHTML = describe(i, l, t);
}
/* ══ Personalisation layer ═══════════════════════════════════════════════
   The adaptive half of the system: the networks are frozen, but per-wearer
   scoring is not. Every formula below is a direct transcription of
   personal_norm_service.dart / personal_model_state.dart, driven by constants
   scraped from those files at build time so the two cannot drift.
   This panel renders MECHANISM, not a recorded wearer. */
const K = DATA.personalisation.consts;
// Slider baseline is the real recorded wearer, not an invented one.
const PS0 = { n: 1, mean: Math.round(DATA.session.sessionFri), sd: 0 };
const PS = { ...PS0 };

/* personal_model_state.dart — blendWeight getter */
function blendWeight(n){
  if (n < K.kMinSessions) return 0;
  if (n >= K.kFullSessions) return 1;
  return (n - (K.kMinSessions - 1)) / (K.kFullSessions - (K.kMinSessions - 1));
}
/* personal_model_state.dart — maturity getter (drives the UI ring only) */
const maturity = n => Math.min(1, n / K.kFullSessions);

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* personal_norm_service.dart — buildNorms band edges, clamps included */
function bands(n, mean, sdRaw){
  const w = blendWeight(n);
  const sd = Math.min(Math.max(K.sdAbsoluteFloorFri || 4.0,
                               Math.abs(mean) * K.sdFloorFraction, sdRaw), K.friSdCeiling);
  let pC = clamp(mean + 1 * sd, K.popCaution - K.bandDriftLimit,
                 Math.min(K.popCaution + K.bandDriftLimit, K.cautionCeiling));
  let pH = clamp(mean + 2 * sd, K.popHigh - K.bandDriftLimit,
                 Math.min(K.popHigh + K.bandDriftLimit, K.highCeiling));
  if (pH < pC + K.minBandWidth) pH = pC + K.minBandWidth;
  return {
    w, sd, pC, pH,
    caution: (1 - w) * K.popCaution + w * pC,
    high:    (1 - w) * K.popHigh    + w * pH,
  };
}

/* Minimal SVG line chart. Thin marks, recessive grid, direct end-labels. */
function lineChart({ w = 560, h = 150, xs, series, xTicks, yTicks, yMax = 1, xLab, yLab }){
  const P = { l: 40, r: 78, t: 10, b: 26 };
  const iw = w - P.l - P.r, ih = h - P.t - P.b;
  const X = v => P.l + (v - xs[0]) / (xs[xs.length - 1] - xs[0]) * iw;
  const Y = v => P.t + ih - (v / yMax) * ih;
  let g = '';
  for (const t of yTicks){
    g += `<line class="gridline" x1="${P.l}" x2="${P.l + iw}" y1="${Y(t)}" y2="${Y(t)}"/>`;
    g += `<text class="tick" x="${P.l - 6}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`;
  }
  for (const t of xTicks)
    g += `<text class="tick" x="${X(t)}" y="${h - 8}" text-anchor="middle">${t}</text>`;
  g += `<line class="axline" x1="${P.l}" x2="${P.l + iw}" y1="${P.t + ih}" y2="${P.t + ih}"/>`;

  for (const s of series){
    const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
          stroke-linejoin="round" stroke-dasharray="${s.dash || ''}"/>`;
    const last = s.pts[s.pts.length - 1];
    g += `<text class="serieslbl" x="${X(last[0]) + 7}" y="${Y(last[1]) + 3.5}"
          fill="${s.color}">${s.name}</text>`;
  }
  if (xLab) g += `<text class="tick" x="${P.l + iw / 2}" y="${h - 8}" text-anchor="middle"
                  style="opacity:0">${xLab}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"
          role="img" aria-label="${yLab || ''}">${g}</svg></div>`;
}

const SESS = DATA.session;

/* Trace chart: every recorded sample, over the risk bands it was scored against. */
function traceChart(vals, edges, { w = 640, h = 190 } = {}){
  const P = { l: 34, r: 12, t: 8, b: 22 };
  const iw = w - P.l - P.r, ih = h - P.t - P.b;
  const X = i => P.l + i / (vals.length - 1) * iw;
  const Y = v => P.t + ih - v / 100 * ih;
  const band = (a, b, c) =>
    `<rect x="${P.l}" y="${Y(b)}" width="${iw}" height="${Y(a) - Y(b)}" fill="${c}" opacity=".14"/>`;

  let g = band(0, edges.caution, css('--safe'))
        + band(edges.caution, edges.high, css('--caution'))
        + band(edges.high, 100, css('--danger'));

  for (const t of [0, 25, 50, 75, 100]){
    g += `<line class="gridline" x1="${P.l}" x2="${P.l + iw}" y1="${Y(t)}" y2="${Y(t)}" opacity=".3"/>`;
    g += `<text class="tick" x="${P.l - 6}" y="${Y(t) + 3}" text-anchor="end">${t}</text>`;
  }
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  g += `<path d="${d}" fill="none" stroke="${css('--ink')}" stroke-width="1.1"
        stroke-linejoin="round" opacity=".85"/>`;
  g += `<line x1="${P.l}" x2="${P.l + iw}" y1="${Y(SESS.sessionFri)}" y2="${Y(SESS.sessionFri)}"
        stroke="${css('--accent')}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  g += `<text class="serieslbl" x="${P.l + iw - 4}" y="${Y(SESS.sessionFri) - 5}"
        text-anchor="end" fill="${css('--accent')}">session FRI ${SESS.sessionFri}</text>`;
  g += `<text class="tick" x="${P.l}" y="${h - 6}">0</text>
        <text class="tick" x="${P.l + iw}" y="${h - 6}" text-anchor="end">${vals.length} samples</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
          aria-label="recorded fall risk index across the session">${g}</svg></div>`;
}


function renderPersonal(){
  const ink = css('--ink-3'), acc = css('--accent'), dg = css('--danger');
  const b = bands(PS.n, PS.mean, PS.sd);
  const xs = Array.from({ length: 21 }, (_, i) => i);

  const ramp = lineChart({
    xs, yMax: 1, yTicks: [0, .5, 1], xTicks: [0, 5, 10, 15, 20], h: 120,
    series: [
      { name: 'blendWeight', color: acc, pts: xs.map(n => [n, blendWeight(n)]) },
      { name: 'ring', color: ink, dash: '3 3', pts: xs.map(n => [n, maturity(n)]) },
    ],
    yLab: 'personalisation weight against session count',
  });

  const zs = Array.from({ length: 61 }, (_, i) => -3 + i * .1);
  const anchorAt = Math.min(PS.mean, 100);
  const anchor = lineChart({
    xs: zs, yMax: 100, yTicks: [0, 50, 100], xTicks: [-3, -2, -1, 0, 1, 2, 3], h: 130,
    series: [
      { name: 'shipped', color: acc, pts: zs.map(z => [z, clamp(anchorAt + K.gainPerSd * z, 0, 100)]) },
      { name: 'naive', color: dg, dash: '4 3', pts: zs.map(z => [z, clamp(50 + K.gainPerSd * z, 0, 100)]) },
    ],
    yLab: 'anchored versus naive personal sub-score',
  });

  const seg = (a, z, c, lbl) => `<div style="flex:${Math.max(z - a, .5)};background:${c}">${lbl}</div>`;
  const row = (label, c, hgh) => `<div class="bandrow"><span class="bl">${label}</span>
    <div class="bandbar">${seg(0, c, css('--safe'), 'Safe')}
    ${seg(c, hgh, css('--caution'), 'Caution')}
    ${seg(hgh, 100, css('--danger'), 'High')}</div>
    <span class="num" style="font-size:11px;width:74px">${c.toFixed(1)} / ${hgh.toFixed(1)}</span></div>`;

  const M = SESS.meta;
  const kv = (k, v) => `<div class="kvb"><div class="kvk">${k}</div><div class="kvv num">${v}</div></div>`;

  $('field').innerHTML = `<div class="pwrap">
    <div class="prov"><b>${SESS.file}</b> · ${M.Date} · ${M.Duration} · ${M.Steps} steps ·
      ${SESS.n.toLocaleString()} samples · real recording</div>

    <div class="psec">
      <h3>Recorded session</h3>
      ${traceChart(SESS.fri, { caution: K.popCaution, high: K.popHigh })}
      <div class="kvrow">${kv('session FRI', SESS.sessionFri)}${kv('peak', SESS.traceMax)}
        ${kv('min', SESS.traceMin)}${kv('trace sd', SESS.traceSd.toFixed(2))}
        ${kv('steps', M.Steps)}${kv('band', 'High Risk')}</div>
    </div>

    <div class="psec">
      <h3>What this session contributes</h3>
      <div class="kvrow">${kv('observations added', 1)}${kv('sessions held', 1)}
        ${kv('raw sd', '0.00')}${kv('floored sd', (Math.max(K.sdAbsoluteFloorFri,
          Math.abs(SESS.sessionFri) * K.sdFloorFraction)).toFixed(2))}
        ${kv('blendWeight', blendWeight(1).toFixed(2))}
        ${kv('scoring', 'population')}</div>
      <p class="cap">One session, one observation. Personalisation stays inert until
        session ${K.kMinSessions}.</p>
    </div>

    <div class="psec">
      <h3>Maturity</h3>
      ${ramp}
    </div>

    <div class="psec">
      <h3>Band edges</h3>
      <div class="sliders">
        <div class="sl"><label for="pN">sessions</label>
          <input type="range" id="pN" min="0" max="20" value="${PS.n}"><output>${PS.n}</output></div>
        <div class="sl"><label for="pM">FRI mean</label>
          <input type="range" id="pM" min="10" max="90" value="${PS.mean}"><output>${PS.mean}</output></div>
        <div class="sl"><label for="pS">FRI sd</label>
          <input type="range" id="pS" min="0" max="20" value="${PS.sd}"><output>${PS.sd}</output></div>
        <div class="sl"><label>blendWeight</label><output>${b.w.toFixed(2)}</output></div>
        <button class="reset" id="pReset">reset to recorded</button>
      </div>
      ${row('population', K.popCaution, K.popHigh)}
      ${row('personalised', b.caution, b.high)}
      <p class="cap">Sliders start at this wearer's recorded values. Edges clamp to
        ±${K.bandDriftLimit} of population, hard-stopped at ${K.cautionCeiling} / ${K.highCeiling}.</p>
    </div>

    <div class="psec">
      <h3>Anchoring</h3>
      ${anchor}
      <p class="cap">At this wearer's recorded ${SESS.sessionFri}, naive centring would move
        them <b>${Math.abs(anchorAt - 50).toFixed(1)} points</b> toward Safe at every z.</p>
    </div>
  </div>`;

  ['pN', 'pM', 'pS'].forEach((id, i) => {
    const el = $(id);
    el.oninput = () => { PS[['n', 'mean', 'sd'][i]] = +el.value; renderPersonal(); $(id).focus(); };
  });
  $('pReset').onclick = () => { Object.assign(PS, PS0); renderPersonal(); };
}

/* ── Wiring ──────────────────────────────────────────────────────────────── */
function clearPin(){
  S.pinned = null; S.pinnedEl = null;
  $('pinHint').textContent = 'hover a cell';
}
function selectLayer(id){

  if (id !== '__all__') S.role = layer().tensors[0].role;

}
/* The readout rail and the colour controls only mean anything for weights. */
function chrome(on){
  document.querySelector('.rail-r').style.display = on ? '' : 'none';
  document.querySelector('.panel-h .ctl').style.display = on ? '' : 'none';

}
function selectModel(i){
  S.view = 'model'; S.m = i;
  chrome(true);
  renderHead();
  selectLayer('__all__');   // land on the complete field, not a single layer
}
function selectPersonal(){
  S.view = 'personal';
  clearPin();
  chrome(false);
  renderHead();
  $('fTitle').textContent = 'Adaptive scoring';
  $('fSub').textContent = 'mechanism transcribed from the shipped Dart source';
  $('segTensor').innerHTML = '';
  renderPersonal();
}

$('tabs').onclick = e => {
  const b = e.target.closest('[data-m]');
  if (!b) return;
  if (b.dataset.m === 'p') selectPersonal(); else selectModel(+b.dataset.m);
};
$('layers').onclick = e => { const b = e.target.closest('[data-l]'); if (b) selectLayer(b.dataset.l); };
$('segTensor').onclick = e => { const b = e.target.closest('[data-r]'); if (b){ S.role = b.dataset.r; clearPin(); renderField(); } };

$('field').addEventListener('mousemove', e => {
  const c = e.target.closest('.cell');
  if (c && S.pinned === null) showCell(+c.dataset.i, c);
});
$('field').addEventListener('click', e => {
  const c = e.target.closest('.cell');
  if (!c) return;
  const i = +c.dataset.i;
  const same = S.pinned === i && S.pinnedEl === c;
  S.pinned = same ? null : i;
  S.pinnedEl = same ? null : c;
  $('pinHint').textContent = S.pinned === null ? 'hover a cell' : 'pinned · click to release';
  if (S.pinned !== null) showCell(i, c);
  document.querySelectorAll('.cell.pin').forEach(x => x.classList.remove('pin'));
  if (S.pinnedEl) S.pinnedEl.classList.add('pin');
});

const toggle = (onId, offId, key, onVal, offVal) => {
  $(onId).onclick  = () => { S[key] = onVal;  $(onId).setAttribute('aria-pressed','true');  $(offId).setAttribute('aria-pressed','false'); renderField(); };
  $(offId).onclick = () => { S[key] = offVal; $(offId).setAttribute('aria-pressed','true'); $(onId).setAttribute('aria-pressed','false');  renderField(); };
};
toggle('cvSqrt', 'cvLin', 'curve', 'sqrt', 'linear');
toggle('scT', 'scM', 'scale', 'tensor', 'model');
$('cellSize').oninput = e => { S.cell = +e.target.value; $('field').style.setProperty('--cell', S.cell + 'px'); };

$('foot').innerHTML = `Every weight above is read directly out of the shipped
  <code>.tflite</code> files by <code>extract_weights.py</code> — nothing is sampled,
  summarised, or synthesised. Layer identity is recovered from the TFLite operator
  graph, since the converter discards Keras layer names. Total across both models:
  <b>${DATA.models.reduce((a, m) => a + m.totalParams, 0).toLocaleString()}</b> parameters.`;

loadRamp();
selectModel(0);

/* Re-resolve the ramp if the viewer's OS theme flips under the page. Guarded:
   the page must still render if the environment lacks matchMedia. */
try {
  matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change', () => { loadRamp(); renderField(); });
} catch (e) { /* non-fatal — ramp stays on the theme resolved at load */ }
</script>
